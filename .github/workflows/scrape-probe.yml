# Throwaway probe: can a GitHub Actions runner scrape Linktree?
# Trigger manually from the Actions tab. Delete once we have an answer.
name: Scrape Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run scraper from runner
        run: go run ./cmd/probe
